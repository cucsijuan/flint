name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Flint ${{ github.ref_name }}
          releaseBody: See the release notes below.
          releaseDraft: true
          args: --config {"bundle":{"createUpdaterArtifacts":true}}

  updater-urls:
    needs: release
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Point latest.json at the public download URLs
        run: |
          gh release download "$TAG" --repo "$REPO" --pattern latest.json
          names=$(gh api "repos/$REPO/releases" --jq "[.[] | select(.tag_name == \"$TAG\") | .assets[] | {key: (.id | tostring), value: .name}] | from_entries")
          jq --argjson names "$names" --arg base "https://github.com/$REPO/releases/download/$TAG" \
            '.platforms |= map_values(.url = "\($base)/\($names[.url | split("/") | last])")' \
            latest.json > fixed.json
          mv fixed.json latest.json
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
