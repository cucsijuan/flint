[package]
name = "flint"
version = "0.16.0"
description = "An open-source, local-first Markdown knowledge base"
license = "AGPL-3.0-or-later"
repository = "https://github.com/cucsijuan/flint"
edition = "2024"
rust-version = "1.88"

[lib]
name = "flint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
base64 = "0.23.1"
fontdb = "0.24.0"
ignore = "0.4.33"
keyring = "4.2"
log = "0.4"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
percent-encoding = "2"
png = "0.18"
pulldown-cmark = { version = "0.13.4", default-features = false }
regex = "1.13.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
spellbook = "0.4"
tauri = { version = "2.11.6", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-log = "2"
tauri-plugin-opener = "2.5.5"
tauri-plugin-os = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-store = "2.4.5"
tauri-plugin-updater = "2.12.0"
tauri-plugin-window-state = "2.4.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
trash = "5.2.9"
yaml-rust2 = "0.13.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "2", features = ["v2_40"] }


[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_Com"] }
windows-core = "0.61"
