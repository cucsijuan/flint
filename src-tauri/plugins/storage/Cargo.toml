[package]
name = "tauri-plugin-storage"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Folder access for Flint on mobile: Android's all-files permission and folder picker."
links = "tauri-plugin-storage"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = "2.11"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
